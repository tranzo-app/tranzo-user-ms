
name: Build & Deploy

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or commit SHA to deploy'
        required: false
        default: 'master'
  push:
    branches: [master]

permissions:
  contents: read
  id-token: write

concurrency:
  group: tranzo-production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and Test
        run: |
          chmod +x mvnw
          ./mvnw clean verify

      - name: Check for tracked server secrets
        run: |
          if git ls-files --error-unmatch .env >/dev/null 2>&1; then
            echo "ERROR: .env is tracked by Git. Refusing to deploy."
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::487450071721:role/TranzoGitHubActionsDeployRole
          aws-region: ap-south-1

      - name: Upload source archive to S3
        env:
          DEPLOY_BUCKET: tranzo-deploy-artifacts-487450071721-ap-south-1
        run: |
          git archive --format=zip --output=deploy.zip HEAD
          aws s3 cp deploy.zip "s3://${DEPLOY_BUCKET}/deploy/${GITHUB_SHA}.zip"

      - name: Deploy through AWS Systems Manager
        env:
          DEPLOY_BUCKET: tranzo-deploy-artifacts-487450071721-ap-south-1
          INSTANCE_ID: i-0e90891a0d946bd15
        shell: bash
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"

          cat > deploy-script.sh <<'SCRIPT'
          set -euo pipefail
          DEPLOY_DIR="/home/ec2-user/tranzo"
          STAGE_DIR="$(mktemp -d /tmp/tranzo-deploy.XXXXXX)"
          trap 'rm -rf "$STAGE_DIR"' EXIT

          aws s3 cp "s3://${DEPLOY_BUCKET}/deploy/${GITHUB_SHA}.zip" "$STAGE_DIR/source.zip"
          python3 -m zipfile -e "$STAGE_DIR/source.zip" "$STAGE_DIR/source"

          if [ ! -f "$STAGE_DIR/source/Dockerfile" ] || [ ! -f "$STAGE_DIR/source/docker-compose.yml" ]; then
            echo "ERROR: Required Docker deployment files are missing."
            exit 1
          fi

          python3 - "$STAGE_DIR/source" "$DEPLOY_DIR" <<'PY'
          import os
          import shutil
          import sys

          source, destination = sys.argv[1:3]
          os.makedirs(destination, exist_ok=True)

          for name in os.listdir(source):
              if name in {".env", ".git", "target"}:
                  continue
              src = os.path.join(source, name)
              dst = os.path.join(destination, name)
              if os.path.islink(src):
                  raise SystemExit(f"Refusing symlink: {name}")
              elif os.path.isdir(src):
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  shutil.copy2(src, dst)
          PY

          cd "$DEPLOY_DIR"
          export IMAGE_TAG="$SHORT_SHA"
          export GIT_SHA="$SHORT_SHA"
          export DOCKER_BUILDKIT=0
          export COMPOSE_DOCKER_CLI_BUILD=0
          docker-compose build --no-cache app
          docker-compose up -d --no-deps app
          docker ps --filter name=tranzo-user
          SCRIPT

          jq -n \
            --arg script "$(cat deploy-script.sh)" \
            --arg bucket "$DEPLOY_BUCKET" \
            --arg sha "$GITHUB_SHA" \
            --arg short "$SHORT_SHA" \
            '{commands: [
              ("export DEPLOY_BUCKET=" + ($bucket | @sh) +
               " GITHUB_SHA=" + ($sha | @sh) +
               " SHORT_SHA=" + ($short | @sh) +
               "\n" + $script)
            ]}' > ssm-parameters.json

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Tranzo deployment ${SHORT_SHA}" \
            --parameters file://ssm-parameters.json \
            --query 'Command.CommandId' \
            --output text)"

          echo "SSM command: ${COMMAND_ID}"

          for attempt in $(seq 1 60); do
            STATUS="$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" \
              --query 'Status' \
              --output text 2>/dev/null || true)"
            echo "Deployment status: ${STATUS:-Pending}"

            case "$STATUS" in
              Success)
                echo "Deployment completed."
                exit 0
                ;;
              Failed|Cancelled|TimedOut)
                aws ssm get-command-invocation \
                  --command-id "$COMMAND_ID" \
                  --instance-id "$INSTANCE_ID" \
                  --output json || true
                exit 1
                ;;
            esac
            sleep 10
          done

          echo "Timed out waiting for deployment. Check Systems Manager Run Command."
          exit 1

      
      - name: Verify public API
        run: |
          set -e

          for attempt in $(seq 1 12); do
            CODE=$(curl -sS -o /tmp/tranzo-api-check.txt \
              -w '%{http_code}' --max-time 10 https://api.tranzo.in/ || true)

            echo "API check ${attempt}/12: HTTP ${CODE:-000}"

            if [ "$CODE" = "401" ] || \
               { [ "$CODE" -ge 200 ] && [ "$CODE" -lt 400 ]; }; then
              echo "API is responding successfully."
              cat /tmp/tranzo-api-check.txt
              exit 0
            fi

            if [ "$CODE" != "000" ] && [ "$CODE" -lt 500 ]; then
              echo "Unexpected HTTP status: $CODE"
              cat /tmp/tranzo-api-check.txt
              exit 1
            fi

            sleep 5
          done

          echo "API did not become healthy within the retry window."
          cat /tmp/tranzo-api-check.txt
          exit 1
